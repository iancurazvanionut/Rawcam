name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o RawCam.zip -d .

      - name: Remove stray non-xml file
        run: rm -f RawCam/app/src/main/res/values/ic_launcher_note.txt

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept licenses & install SDK platform
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle -p RawCam assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RawCam-debug-apk
          path: RawCam/app/build/outputs/apk/debug/*.apk
